      <stop offset="0" stop-color="#4f4fc4"/>
      <stop offset="0.55" stop-color="#2a2585"/>
      <stop offset="1" stop-color="#16124a"/>
    </linearGradient>
    <linearGradient id="f" x1="0" y1="1" x2="0.4" y2="0">
      <stop offset="0" stop-color="#c3cdff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#t)"/>
  <!-- A faint rim, so the deep corner doesn't melt into a dark tab bar. -->
